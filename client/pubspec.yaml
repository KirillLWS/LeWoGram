publish_to: "none"
version: 0.0.1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  firebase_core: ^3.8.1
  firebase_messaging: ^15.2.2
  permission_handler: ^11.3.1
  shared_preferences: ^2.3.3
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1
  device_info_plus: ^11.2.0
  battery_plus: ^6.2.1
  geolocator: ^13.0.2
  url_launcher: ^6.3.1
  package_info_plus: ^8.1.2
  open_file: ^3.5.11
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
